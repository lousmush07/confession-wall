<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
         sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
         updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs, onSnapshot, doc, updateDoc,
         deleteDoc, query, orderBy, serverTimestamp, getDoc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ══════════════════════════════════════════════════════
//  REPLACE THIS WITH YOUR FIREBASE CONFIG
// ══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOUR_API_KEY",
  authDomain: "REPLACE_WITH_YOUR_AUTH_DOMAIN",
  projectId: "REPLACE_WITH_YOUR_PROJECT_ID",
  storageBucket: "REPLACE_WITH_YOUR_STORAGE_BUCKET",
  messagingSenderId: "REPLACE_WITH_YOUR_MESSAGING_SENDER_ID",
  appId: "REPLACE_WITH_YOUR_APP_ID"
};
// ══════════════════════════════════════════════════════

let app, auth, db, googleProvider;
let firebaseReady = false;

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  googleProvider = new GoogleAuthProvider();
  firebaseReady = true;
} catch(e) {
  console.warn('Firebase not configured, running in local mode:', e.message);
}

// Expose to global scope for use in non-module scripts
window._fb = { auth, db, googleProvider, firebaseReady,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
  sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, updateProfile,
  collection, addDoc, getDocs, onSnapshot, doc, updateDoc, deleteDoc,
  query, orderBy, serverTimestamp, getDoc, setDoc };

window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;--bg2:#141417;--bg3:#1c1c21;--bg4:#242429;
  --border:#2a2a32;--border2:#3a3a45;
  --text:#e8e6f0;--text2:#9896a8;--text3:#5a5868;
  --accent:#c084fc;--accent2:#a855f7;--accent3:#7c3aed;
  --red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--green:#4ade80;--pink:#f472b6;
  --radius:14px;--radius-sm:8px;--radius-lg:20px;
  font-family:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:'Playfair Display',serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Hide Setup/Local Mode banner notices gracefully */
.setup-notice, .install-banner {
  display: none !important;
}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:24px 0;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;overflow-y:auto;max-height:100vh}
.content{max-width:720px;margin:0 auto;padding:24px 20px}

/* Brand */
.brand{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px}
.brand-name{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);letter-spacing:-0.5px}
.brand-sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

/* Nav */
.nav-section{padding:0 12px;margin-bottom:8px}
.nav-label{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;padding:0 8px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;color:var(--text2);transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,#2d1b69,#1e1040);color:var(--accent);font-weight:500}
.nav-item i{font-size:16px;width:18px}
.nav-badge{margin-left:auto;background:var(--accent3);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent3),#ec4899);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--text3)}

/* Page header */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:26px;color:var(--text);letter-spacing:-0.5px}
.page-title span{color:var(--accent)}
.search-bar{position:relative;flex:1;max-width:300px}
.search-bar input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:.15s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}

/* Pills */
.pills{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text2);transition:.15s;font-family:inherit}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.active{background:var(--accent3);border-color:var(--accent3);color:#fff;font-weight:500}

/* Post card */
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;transition:.2s;cursor:pointer;position:relative;overflow:hidden}
.post-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:.2s}
.post-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.post-card:hover::before{opacity:1}
.post-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.anon-badge{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2)}
.anon-badge i{font-size:13px;color:var(--accent)}
.cat-tag{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500;background:rgba(124,58,237,.15);color:var(--accent);border:1px solid rgba(124,58,237,.3)}
.time-ago{margin-left:auto;font-size:12px;color:var(--text3)}
.post-content{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:16px}
.post-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.react-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--text2);transition:.15s;font-family:inherit}
.react-btn:hover{border-color:var(--border2);color:var(--text);transform:scale(1.05)}
.react-btn.reacted{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.4);color:var(--accent)}
.react-btn .count{font-weight:500}
.action-btn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radius-sm);background:none;border:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--text3);transition:.15s;font-family:inherit}
.action-btn:hover{color:var(--text2);border-color:var(--border2)}
.action-btn i{font-size:14px}

/* Create form */
.create-card{background:var(--bg2);border:1px solid var(--accent3);border-radius:var(--radius-lg);padding:28px;margin-bottom:24px;box-shadow:0 0 40px rgba(124,58,237,.08)}
.create-card h2{font-size:20px;color:var(--text);margin-bottom:6px}
.create-card p{font-size:13px;color:var(--text3);margin-bottom:20px}
.form-group{margin-bottom:16px;position:relative}
.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.form-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:15px;color:var(--text);font-family:inherit;resize:vertical;min-height:140px;outline:none;transition:.15s;line-height:1.6}
.form-textarea:focus{border-color:var(--accent)}
.form-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;cursor:pointer;transition:.15s}
.form-select:focus{border-color:var(--accent)}
.char-count{font-size:11px;color:var(--text3);text-align:right;margin-top:4px}

/* Buttons */
.btn-primary{background:linear-gradient(135deg,var(--accent3),#9333ea);color:#fff;border:none;padding:11px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2);padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-google{background:#fff;color:#3c4043;border:1px solid #dadce0;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn-google:hover{background:#f8f9fa;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}

/* Admin stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:28px;color:var(--accent);line-height:1}
.stat-label{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-close{background:none;border:1px solid var(--border);border-radius:6px;padding:6px;cursor:pointer;color:var(--text2);display:flex;align-items:center;transition:.15s}
.modal-close:hover{color:var(--text);border-color:var(--border2)}

/* Comment */
.comment{padding:14px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--border)}
.comment-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text3)}
.comment-content{font-size:14px;color:var(--text);line-height:1.6}
.comment-input-row{display:flex;gap:10px;margin-top:16px}
.comment-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:.15s}
.comment-input:focus{border-color:var(--accent)}

/* Trending rank */
.trending-num{position:absolute;top:16px;right:16px;font-family:'Playfair Display',serif;font-size:36px;color:var(--bg3);line-height:1;font-style:italic;pointer-events:none}

/* Admin table */
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.admin-table tr:last-child td{border-bottom:none}
.status-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.status-active{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.2)}
.status-banned{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.status-pending{background:rgba(251,191,36,.1);color:var(--amber);border:1px solid rgba(251,191,36,.2)}

/* Toast */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;animation:slideIn .2s ease;min-width:200px;max-width:300px}
.toast.success{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}
.toast.error{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.toast.info{border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.06)}
.toast i{font-size:16px}
.toast.success i{color:var(--green)}.toast.error i{color:var(--red)}.toast.info i{color:var(--blue)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Auth */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:24px}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;width:100%;max-width:440px}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo h1{font-size:28px;color:var(--text);letter-spacing:-1px}
.auth-logo p{font-size:13px;color:var(--text3);margin-top:6px}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:.15s}
.form-input:focus{border-color:var(--accent)}
.pass-wrap{position:relative}
.pass-wrap .form-input{padding-right:44px}
.pass-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);display:flex;padding:4px;transition:.15s}
.pass-toggle:hover{color:var(--text2)}
.auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text3)}
.auth-switch a{color:var(--accent);cursor:pointer;text-decoration:none}
.auth-switch a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.forgot-link{font-size:12px;color:var(--text3);cursor:pointer;text-align:right;display:block;margin-top:-8px;margin-bottom:12px;transition:.15s}
.forgot-link:hover{color:var(--accent)}

/* T&C checkbox */
.tc-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;cursor:pointer}
.tc-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent3);cursor:pointer;flex-shrink:0;margin-top:2px}
.tc-row label{font-size:12px;color:var(--text3);cursor:pointer;line-height:1.5}
.tc-row label a{color:var(--accent);text-decoration:none}
.tc-row label a:hover{text-decoration:underline}

/* Profile */
.profile-header{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(236,72,153,.1));border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:24px;display:flex;align-items:center;gap:20px}
.profile-avatar-lg{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent3),#ec4899);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:28px;color:#fff;flex-shrink:0;overflow:hidden}
.profile-avatar-lg img{width:100%;height:100%;object-fit:cover}
.profile-stats{display:flex;gap:24px;margin-top:10px}
.profile-stat{text-align:center}
.profile-stat-num{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent)}
.profile-stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* AI */
.ai-response{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:var(--radius-sm);padding:14px;margin-top:12px;font-size:14px;color:var(--text2);line-height:1.6}
.ai-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.3}to{opacity:1}}

/* Loading */
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{height:160px;border-radius:var(--radius);margin-bottom:14px}

/* Report */
.report-option{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;margin-bottom:8px;transition:.15s}
.report-option:hover{border-color:var(--border2);background:var(--bg3)}
.report-option.selected{border-color:var(--accent);background:rgba(124,58,237,.1)}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:48px;display:block;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}

/* T&C modal content */
.tc-content{font-size:13px;color:var(--text2);line-height:1.8;max-height:400px;overflow-y:auto;padding-right:8px}
.tc-content h3{color:var(--text);font-size:15px;margin:16px 0 6px}
.tc-content p{margin-bottom:10px}

/* New post flash */
@keyframes newPost{0%{border-color:var(--accent);box-shadow:0 0 20px rgba(192,132,252,.3)}100%{border-color:var(--border)}}
.post-card.new{animation:newPost 2s ease forwards}

/* Mobile bottom nav */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;justify-content:space-around}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;font-size:10px;transition:.15s}
.mobile-nav-item.active{color:var(--accent)}
.mobile-nav-item i{font-size:22px}

.tag-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tag-scroll::-webkit-scrollbar{display:none}

@media(max-width:640px){
  .sidebar{display:none}
  .mobile-nav{display:flex}
  .main{padding-bottom:70px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .modal{padding:20px}
  .content{padding:16px}
  .page-title{font-size:22px}
  .toast-container{bottom:80px;right:12px;left:12px}
  .toast{min-width:unset;max-width:100%}
}
</style>

  <button class="mobile-nav-item" onclick="navigate('trending')" id="mn-trending"><i class="ti ti-trending-up"></i>Trending</button>
  <button class="mobile-nav-item" onclick="navigate('create')" id="mn-create"><i class="ti ti-plus-circle"></i>Confess</button>
  <button class="mobile-nav-item" onclick="navigate('bookmarks')" id="mn-bookmarks"><i class="ti ti-bookmark"></i>Saved</button>
  <button class="mobile-nav-item" onclick="navigate('profile')" id="mn-profile"><i class="ti ti-user-circle"></i>Me</button>
</nav>

<script>
// ═══════════════════════════════════════════════════════════
//  GLOBAL STATE
// ═══════════════════════════════════════════════════════════
const CATS = ['All','Relationships','School','Family','Work','Mental Health','Random','Secrets'];
const EMOJIS = [{e:'❤️',k:'love'},{e:'😂',k:'laugh'},{e:'😢',k:'sad'},{e:'😲',k:'shocked'}];

let fb = null; // set after firebase-ready
let unsubPosts = null; // firestore live listener

let state = {
  page: 'login',
  user: null,           // Firebase auth user + extra profile data
  posts: [],            // live from Firestore (or localStorage fallback)
  filter: 'All',
  search: '',
  modal: null,
  adminTab: 'overview',
  firebaseMode: false,  // true when Firebase is configured & working
  loadingPosts: true,
  showPassLogin: false,
  showPassRegister: false,
};

// Local storage keys
const LS_USERS  = 'conf_users_v2';
const LS_POSTS  = 'conf_posts_v2';
const LS_ME     = 'conf_me_v2';

// ── Local-mode fallback data ──────────────────────────────
const SEED_POSTS = [
  {id:'s1',userId:'u2',content:"I've been pretending to be happy at work for 3 years. Every morning I sit in my car for 10 minutes just to compose myself before walking in. Nobody knows.",category:'Work',reactions:{love:12,laugh:2,sad:34,shocked:8},comments:[],reportCount:0,bookmarked:false,createdAt:Date.now()-3600000*5},
  {id:'s2',userId:'u3',content:"I still sleep with a stuffed animal I've had since I was 4. I'm 28. It helps with my anxiety and I refuse to feel ashamed about it anymore.",category:'Mental Health',reactions:{love:89,laugh:14,sad:5,shocked:3},comments:[{id:'c1',userId:'u4',content:"This is completely valid. I do the same.",createdAt:Date.now()-1800000}],reportCount:0,bookmarked:false,createdAt:Date.now()-3600000*2},
  {id:'s3',userId:'u5',content:"I accidentally got CC'd on an email chain where my whole team called me 'the weakest link'. I've been job hunting ever since but told no one.",category:'Work',reactions:{love:5,laugh:0,sad:67,shocked:89},comments:[],reportCount:0,bookmarked:false,createdAt:Date.now()-3600000*8},
  {id:'s4',userId:'u6',content:"I told my parents I graduated college. I didn't. I've been faking it for 2 years. The shame is eating me alive.",category:'Family',reactions:{love:23,laugh:0,sad:45,shocked:120},comments:[],reportCount:0,bookmarked:false,createdAt:Date.now()-3600000*14},
  {id:'s5',userId:'u7',content:"I've been messaging my ex under a fake account for a year just to see if they're okay. We ended badly and I just needed to know.",category:'Relationships',reactions:{love:34,laugh:8,sad:19,shocked:45},comments:[],reportCount:0,bookmarked:false,createdAt:Date.now()-3600000*20},
];

const DEFAULT_USERS = [
  {id:'u1',username:'Admin',email:'admin@confessional.app',password:'admin123',role:'admin',status:'active',photoURL:null,createdAt:Date.now()-86400000*30},
  {id:'u2',username:'Ghost_7742',email:'ghost@example.com',password:'pass123',role:'user',status:'active',photoURL:null,createdAt:Date.now()-86400000*10},
  {id:'u3',username:'Shadow_9981',email:'shadow@example.com',password:'pass123',role:'user',status:'active',photoURL:null,createdAt:Date.now()-86400000*7},
];

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let localUsers = lsGet(LS_USERS, DEFAULT_USERS);
function saveLocalUsers(){lsSet(LS_USERS,localUsers);}

function loadLocalPosts(){
  const saved = lsGet(LS_POSTS, null);
  if(saved && saved.length) return saved;
  lsSet(LS_POSTS, SEED_POSTS);
  return SEED_POSTS;
}
function saveLocalPosts(){lsSet(LS_POSTS, state.posts);}

// ═══════════════════════════════════════════════════════════
//  FIREBASE INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener('firebase-ready', () => {
  fb = window._fb;
  if(!fb || !fb.firebaseReady) { initLocalMode(); return; }

  // Check if the user left a placeholder config
  try {
    const testKey = Object.values(fb).find(v => typeof v === 'string' && v.includes('REPLACE'));
    if(testKey) { initLocalMode(); return; }
  } catch(e) {}

  state.firebaseMode = true;

  // Auth state listener
  fb.onAuthStateChanged(fb.auth, async (firebaseUser) => {
    if(firebaseUser) {
      // Load extra profile from Firestore
      try {
        const snap = await fb.getDoc(fb.doc(fb.db, 'users', firebaseUser.uid));
        const extra = snap.exists() ? snap.data() : {};
        state.user = {
          id: firebaseUser.uid,
          username: extra.username || firebaseUser.displayName || firebaseUser.email.split('@')[0],
          email: firebaseUser.email,
          photoURL: firebaseUser.photoURL || null,
          role: extra.role || 'user',
          status: extra.status || 'active',
        };
        lsSet(LS_ME, state.user);
      } catch(e) {
        state.user = {id:firebaseUser.uid,username:firebaseUser.displayName||firebaseUser.email.split('@')[0],email:firebaseUser.email,photoURL:firebaseUser.photoURL||null,role:'user',status:'active'};
      }
      if(state.user.status === 'banned') { await fb.signOut(fb.auth); state.user=null; toast('This account has been banned.','error'); state.page='login'; render(); return; }
      if(state.page==='login'||state.page==='register') state.page='home';
      subscribeFirestorePosts();
      render();
    } else {
      state.user = null;
      if(unsubPosts){unsubPosts();unsubPosts=null;}
      state.posts = [];
      state.page = 'login';
      render();
    }
  });
});

function initLocalMode() {
  state.firebaseMode = false;
  // Restore session if any
  const saved = lsGet(LS_ME, null);
  if(saved) {
    const fresh = localUsers.find(u=>u.id===saved.id);
    state.user = fresh || null;
    if(state.user) state.page = 'home';
  }
  state.posts = loadLocalPosts();
  state.loadingPosts = false;
  render();
}

function subscribeFirestorePosts() {
  if(!fb||!fb.firebaseReady) return;
  if(unsubPosts){unsubPosts();unsubPosts=null;}
  const q = fb
